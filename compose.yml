# Production on briggen.dev: behind the server's shared Traefik (network "proxy", Let's Encrypt resolver).
# Deploy: rsync the repo to /root/trainnet, put .env next to this file, `docker compose up -d --build`.
services:
  trainnet:
    build: .
    image: trainnet:local
    container_name: trainnet
    restart: unless-stopped
    env_file: .env
    environment:
      ARCHIVE_DIR: /archive
    volumes:
      - ./data:/data # rail graph, paths, stats.db; must be owned by uid 1000 (the image's bun user)
      - /mnt/storagebox/trainnet:/archive # GTFS, occupancy and Ist-Daten zips on the storage box (CIFS, mounted as uid 1000)
    mem_limit: 2g # ~500 MB steady, ~1.3 GB while the daily timetable loads
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trainnet.rule=Host(`trainnet.briggen.dev`)"
      - "traefik.http.routers.trainnet.entrypoints=websecure"
      - "traefik.http.routers.trainnet.tls.certresolver=letsencrypt"
      - "traefik.http.services.trainnet.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=false" # built here, not pulled: watchtower must not swap it for a Docker Hub image
    networks:
      - proxy

networks:
  proxy:
    external: true
